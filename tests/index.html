<style>
  .result { border-collapse: collapse; width: 100%; margin-top: var(--s-4); }
  .result th, .result td { text-align: left; }
  .result td.verdict { width: 4.5rem; font-family: var(--font-mono); font-weight: 600; }
  .result tr.pass td.verdict { color: var(--accent-ink); }
  .result tr.fail td.verdict { color: #b60205; }
  .result td.detail { color: #b60205; font-family: var(--font-mono); font-size: 0.8125rem; }
  .summary { margin-top: var(--s-5); padding: var(--s-4) var(--s-5); border-radius: var(--radius); }

  .summary.ng { background: #fdecea; color: #b60205; }
</style>

<header class="site-head">

  </div>
</header>

<main class="site-main" id="main">
  <div class="page">

    <h1>検証</h1>
    <p class="lede">計算部分を既知値・境界値と照合します。描画も DOM も使わないので、同じ内容が <code>node tests/run.js</code> でも走ります。ここが通らないものは公開しません。</p>

    <div class="note prose" style="max-width: none;">
      <p><strong>このページで分かること</strong>：乱数の再現性、数値の整形、行列の合成と任意点回転の一般式との一致、k-means の収束・単調性・空クラスタの扱い。</p>
      <p><strong>分からないこと</strong>：画面の見た目、操作の反映、実機での表示。これらは実際のデモページを開いて確かめます。</p>
    </div>

    <div id="summary" class="summary">実行中…</div>
    <table class="result" id="result"></table>

  </div>
</main>

<script>
(function () {
  "use strict";

  var cases = JsDemo.Tests.cases;
  var table = document.getElementById("result");
  var summary = document.getElementById("summary");
  var failed = 0;
  var currentGroup = "";

  function cell(tag, text, className) {
    var el = document.createElement(tag);
    el.textContent = text;
    if (className) { el.className = className; }
    return el;
  }

  cases.forEach(function (testCase) {
    if (testCase.group !== currentGroup) {
      currentGroup = testCase.group;
      var head = document.createElement("tbody");
      var headRow = document.createElement("tr");
      var th = document.createElement("th");
      th.colSpan = 3;
      th.textContent = currentGroup;
      th.style.paddingTop = "1.25rem";
      headRow.appendChild(th);
      head.appendChild(headRow);
      table.appendChild(head);
    }

    var message = null;
    try {
      testCase.run();
    } catch (error) {
      message = error.message;
      failed += 1;
    }

    var body = table.lastChild;
    var row = document.createElement("tr");
    row.className = message ? "fail" : "pass";
    row.appendChild(cell("td", message ? "FAIL" : "PASS", "verdict"));
    row.appendChild(cell("td", testCase.name));
    row.appendChild(cell("td", message || "", "detail"));
    body.appendChild(row);
  });

  summary.className = "summary " + (failed ? "ng" : "ok");
  summary.textContent = (cases.length - failed) + " / " + cases.length + " 件が通った"
    + (failed ? "（" + failed + " 件が落ちた）" : "");
  document.title = (failed ? "失敗 " + failed + " — " : "") + "検証 — JavaScript 学習デモ";
})();
</script>
